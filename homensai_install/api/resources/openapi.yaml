        "description": "Host/Origin/token проверка не пройдена",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PrerequisiteHTTPEnvelope"
            }
          }
        }
      },
      "PrerequisiteHTTP500": {
        "description": "Безопасный внутренний отказ",
        "content": {
          "application/json": {
