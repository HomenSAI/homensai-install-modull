                "additionalProperties": false,
                "properties": {
                  "operation_id": {
                    "type": "string",
                    "description": "Operation belonging to the startup product; required by wizard"
                  },
                  "locale": {
                    "enum": [
                      "ru",
                      "en",
                      "de"
                    ]
                  }
                },
                "required": [
                  "operation_id"
                ]
              }
            }
          }
        }
