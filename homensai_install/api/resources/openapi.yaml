      "PrerequisiteUploadResult": {
        "type": "object",
        "properties": {
          "upload_id": {
            "type": "string",
            "pattern": "^upload_[0-9a-f]{32}$(?![\\s\\S])"
          },
          "component_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "artifact_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4294967296
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$(?![\\s\\S])"
          },
          "state": {
            "enum": [
