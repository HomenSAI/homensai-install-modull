<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomenSAI · Installer</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main class="shell"><header><div><span class="brand">HomenS.AI</span><h1 data-i18n="title">Application setup</h1><p id="product"></p></div><label class="language"><span data-i18n="language">Language</span><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="de">Deutsch</option></select></label></header>
<div id="development" class="notice" hidden data-i18n="development"></div>
<nav aria-label="Installation steps"><ol><li data-step="0" data-i18n="step_environment"></li><li data-step="1" data-i18n="step_terms"></li><li data-step="2" data-i18n="step_review"></li><li data-step="3" data-i18n="step_progress"></li><li data-step="4" data-i18n="step_result"></li></ol></nav>
<section id="error" role="alert" hidden><h2 id="error-title"></h2><p id="error-description"></p><ul id="error-remediation"></ul><code id="error-code"></code><button id="dismiss" type="button" data-i18n="dismiss"></button></section>
<section data-panel="0"><div id="pending-operations" hidden><h2 data-i18n="unfinished_operations"></h2><p data-i18n="unfinished_help"></p><div id="pending-list"></div></div><h2 data-i18n="environment_title"></h2><p data-i18n="environment_help"></p><div class="fields"><label><span data-i18n="mode"></span><select id="mode"><option value="native" data-i18n="native"></option><option value="docker" data-i18n="docker"></option></select></label><label><span data-i18n="location"></span><input id="install-root" autocomplete="off" spellcheck="false"></label><label><span data-i18n="action"></span><select id="action"><option value="install" data-i18n="install"></option><option value="update" data-i18n="update"></option><option value="repair" data-i18n="repair"></option><option value="start" data-i18n="start"></option><option value="stop" data-i18n="stop"></option><option value="backup" data-i18n="backup"></option><option value="restore" data-i18n="restore"></option><option value="rollback" data-i18n="rollback"></option><option value="uninstall" data-i18n="uninstall"></option></select></label></div><div id="product-secrets"></div><label class="fields"><span data-i18n="archive_password"></span><input id="archive-password" type="password" autocomplete="new-password" minlength="12"><small data-i18n="archive_password_help"></small></label><label class="fields"><span data-i18n="archive_path"></span><input id="archive-path" autocomplete="off" spellcheck="false"><small data-i18n="archive_path_help"></small></label><label id="data-loss-row" class="check" hidden><input id="data-loss" type="checkbox"><span data-i18n="data_loss"></span></label><button id="discover" data-i18n="check_environment"></button><p id="environment-status" role="status"></p><details><summary data-i18n="technical_details"></summary><pre id="inventory"></pre></details></section>
<section data-panel="1" hidden><h2 data-i18n="terms_title"></h2><p data-i18n="terms_help"></p><div id="terms" class="terms" tabindex="0" role="region" aria-label="License agreement"></div><label class="check"><input id="accept-terms" type="checkbox" disabled><span data-i18n="accept_terms"></span></label><p class="muted" id="terms-digest"></p></section>
<section data-panel="2" hidden><h2 data-i18n="review_title"></h2><p data-i18n="review_help"></p><ul id="plan-steps" class="steps"></ul><label class="check"><input id="accept-plan" type="checkbox"><span data-i18n="accept_plan"></span></label><details><summary data-i18n="technical_details"></summary><pre id="plan-details"></pre></details></section>
<section data-panel="3" hidden><h2 data-i18n="progress_title"></h2><p id="progress-status" role="status" aria-live="polite"></p><progress id="overall" max="100"></progress><p id="overall-label"></p><div id="components"></div><button id="cancel" class="secondary" data-i18n="cancel"></button><details><summary data-i18n="technical_details"></summary><pre id="events"></pre></details></section>
<section data-panel="4" hidden><h2 id="result-title"></h2><p id="result-description"></p><div id="result-progress"></div><a id="open-app" class="button" hidden target="_blank" rel="noopener noreferrer" data-i18n="open_app"></a><label id="resume-password-row" class="fields" hidden><span data-i18n="archive_password"></span><input id="resume-password" type="password" autocomplete="new-password" minlength="12"></label><button id="resume" class="secondary" hidden data-i18n="resume"></button><button id="maintenance" class="secondary" data-i18n="maintenance"></button><details><summary data-i18n="technical_details"></summary><pre id="result-details"></pre></details></section>
<details id="support"><summary data-i18n="support_title"></summary><div class="fields"><label><span data-i18n="error_search"></span><input id="error-query" type="search"></label><button id="search-errors" class="secondary" data-i18n="search"></button></div><div id="catalog-results"></div><button id="statistics" class="secondary" data-i18n="statistics"></button><pre id="statistics-results"></pre><button id="preview-export" class="secondary" data-i18n="preview_export"></button><pre id="export-preview"></pre><label class="check"><input id="confirm-export" type="checkbox"><span data-i18n="confirm_export"></span></label><button id="export" class="secondary" disabled data-i18n="export"></button></details><footer><button id="back" class="secondary" data-i18n="back"></button><button id="next" data-i18n="next"></button></footer><p class="footnote" data-i18n="local_only"></p></main></body></html>
