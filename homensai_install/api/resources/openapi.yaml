    "responses": {
      "PrerequisiteHTTP200": {
        "description": "Запрос выполнен или durable очередь принята; не product SUCCESS",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PrerequisiteHTTPEnvelope"
            }
          }
        }
      },
      "PrerequisiteHTTP400": {
        "description": "Структурированный отказ входа, binding, consent или состояния",
