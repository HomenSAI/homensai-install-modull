{
  "openapi": "3.1.0",
  "info": {
    "title": "HomenSAI local installation API",
    "version": "1.0",
    "description": "Development contract. Loopback only. SDK/CLI use the same InstallerAPI facade. No build/sign/arbitrary elevated command in HTTP. Wizard session binds product manifest and trust at startup; HTTP accepts only mode/path/action/consents, not arbitrary manifests or trust roots. Generic SDK request schema is separate. Prerequisite HTTP accepts only server-owned plan IDs and explicit consent; registered owner/product/manifest/target/catalog/payload binding is pinned. CLI prerequisites use synchronous trusted SDK injection. GUI prerequisite flow is available for an explicitly registered coordinator; browser/platform acceptance remains separate. Binary local uploads are signed-plan-bound and do not execute installers."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:{port}",
      "variables": {
        "port": {
          "default": "8760",
          "description": "Фактически выбранный локальным controller порт; не фиксированная служба"
        }
      }
    }
  ],
  "security": [
    {
      "InstallerSession": []
    }
  ],
