  "components": {
    "securitySchemes": {
      "InstallerSession": {
        "type": "apiKey",
        "in": "header",
        "name": "X-HInstall-Token",
        "description": "Непредсказуемый token только startup-сессии, не query. Требуются также exact Host и same-origin проверки."
      }
    },
    "schemas": {
      "ValidateRequest": {
        "type": "object",
        "properties": {
          "locale": {
            "enum": [
              "ru",
              "en",
              "de"
            ]
          }
        },
        "required": [],
        "additionalProperties": false
      },
      "DiscoverRequest": {
        "type": "object",
        "properties": {
          "mode": {
            "enum": [
              "native",
              "docker"
            ]
          },
          "install_root": {
            "type": "string"
          },
          "locale": {
            "enum": [
              "ru",
              "en",
              "de"
            ]
          },
          "archive_path": {
            "type": "string",
            "description": "Explicit local archive path for backup or restore; no overwrite of foreign files."
          },
          "acknowledge_data_loss": {
            "type": "boolean",
            "description": "Required true for restore and rollback in wizard."
          },
          "product_modes": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string"
            },
            "description": "Product modes from the startup manifest; engine enforces dependencies and exclusions."
          }
        },
        "required": [],
        "additionalProperties": false
      },
      "PlanRequest": {
        "type": "object",
        "properties": {
          "mode": {
            "enum": [
              "native",
              "docker"
            ]
          },
          "install_root": {
            "type": "string"
          },
          "locale": {
            "enum": [
              "ru",
              "en",
              "de"
            ]
          },
          "action": {
            "enum": [
              "install",
              "update",
              "repair",
              "uninstall",
              "backup",
              "restore",
              "rollback",
              "start",
              "stop",
              "modify_components"
            ]
          },
          "archive_path": {
            "type": "string",
            "description": "Explicit local archive path for backup or restore; no overwrite of foreign files."
          },
          "acknowledge_data_loss": {
            "type": "boolean",
            "description": "Required true for restore and rollback in wizard."
          },
          "product_modes": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string"
            },
            "description": "Product modes from the startup manifest; engine enforces dependencies and exclusions."
          }
        },
        "required": [
          "action"
        ],
        "additionalProperties": false
      },
      "SubmitRequest": {
        "type": "object",
        "properties": {
          "plan_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_-]{0,79}$"
          },
          "plan_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "consent_refs": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 64
          },
          "idempotency_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "accepted_terms": {
            "const": true
          },
          "accepted_plan": {
            "const": true
          },
          "terms_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "locale": {
            "enum": [
              "ru",
              "en",
              "de"
            ]
          }
        },
        "required": [
          "plan_id",
          "plan_digest",
          "consent_refs",
          "idempotency_key",
          "accepted_terms",
          "accepted_plan",
          "terms_digest"
        ],
        "additionalProperties": false
      },
      "ResumeRequest": {
        "type": "object",
        "properties": {
          "decisions": {
            "type": "object"
          }
        },
        "required": [],
        "additionalProperties": false
      },
      "Envelope": {
        "type": "object",
        "required": [
          "api_version",
          "request_id"
        ],
        "properties": {
          "api_version": {
            "const": "1.0"
          },
          "request_id": {
            "type": "string"
          },
          "result": {},
          "error": {
            "type": "object"
          }
        }
      },
      "Operation": {
        "$ref": "schemas/operation.schema.json"
      },
      "Plan": {
        "$ref": "schemas/plan.schema.json"
      },
      "Event": {
        "$ref": "schemas/event.schema.json"
      },
      "ArchiveSecretRequest": {
        "type": "object",
        "properties": {
          "archive_password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 4096,
            "writeOnly": true
          },
          "product_secrets": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "description": "Only secret names declared in the bound signed product manifest. Memory only."
          }
        },
        "additionalProperties": false,
        "minProperties": 1
      },
      "WizardPreferencesRequest": {
        "type": "object",
        "properties": {
          "locale": {
            "enum": [
              "ru",
              "en",
              "de"
            ]
          }
        },
        "required": [
          "locale"
        ],
        "additionalProperties": false
      },
      "OperationSummary": {
        "type": "object",
        "required": [
          "operation_id",
          "plan_id",
          "action",
          "status",
          "product_id",
          "updated_at"
        ],
        "additionalProperties": false,
        "properties": {
          "operation_id": {
            "type": "string"
          },
          "plan_id": {
            "type": "string"
          },
          "action": {
            "enum": [
              "build",
              "install",
              "update",
              "modify_components",
              "repair",
              "reinstall",
              "uninstall",
              "backup",
              "restore",
              "rollback",
              "start",
              "stop"
            ]
          },
          "status": {
            "enum": [
              "QUEUED",
              "RUNNING",
              "SUCCEEDED",
              "FAILED",
              "FAILED_ROLLED_BACK",
              "CANCELED",
              "RECOVERY_REQUIRED",
              "AWAITING_USER",
              "REBOOT_REQUIRED",
              "RELOGIN_REQUIRED"
            ]
          },
          "product_id": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          }
        }
      },
      "OperationListResult": {
        "type": "object",
        "required": [
          "operations",
          "has_more",
          "limit"
        ],
        "additionalProperties": false,
        "properties": {
          "operations": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "$ref": "#/components/schemas/OperationSummary"
            }
          },
          "has_more": {
            "type": "boolean"
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200
          }
        }
      }
    }
  }
}
