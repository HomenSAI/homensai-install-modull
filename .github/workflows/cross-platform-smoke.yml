name: Cross-platform smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements-ci.txt -r requirements-crypto.txt
      - run: python -m pytest -q -ra tests/test_manifest.py tests/test_manifest_v2.py tests/test_compatibility.py tests/test_i18n.py
      - run: python -m pytest -q -ra tests/test_archive.py::test_create_verify_and_restore_roundtrip tests/test_package.py::test_build_both_platforms_and_reproducible tests/test_package.py::test_external_trusted_hash_is_required_and_rejects_changes
