name: Source checks — Linux and Windows core

on:
  push:
    branches: [main, "codex/universal-installer-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  linux-source:
    name: Linux source and user-process integration (no installer acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; official tag verified 2026-10-25
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select CPython 3.14.9 x64 with GIL
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; official tag verified 2026-10-25
        with:
          python-version: "3.14.9"
          architecture: x64
          check-latest: false
          allow-prereleases: false
          freethreaded: false
      - name: Isolate build tools
        run: |
          python -m venv .venv-ci
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Install exact hashed wheels
        run: |
          python -m pip --isolated install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip --isolated check
          python tools/check_build_lock.py --installed
      - name: Observe Python executable metadata for prerequisite tests
        run: python -B tools/ci_python_probe.py
      - name: Verify fixture using an unsafe-mode disposable Python copy
        run: python -B tools/ci_fixture_reproduction.py
      - name: Run complete offline source suite
        run: python -m pytest -q tests
      - name: Run Linux user-process and loopback integration
        run: python -m pytest -q integration_tests
      - name: Build SDK and reference wheels without dependency resolution
        run: |
          python -m build --wheel --no-isolation --outdir dist .
          python -m build --wheel --no-isolation --outdir reference/dist reference
      - name: Record source and wheel inputs locally
        run: python tools/build_receipt.py --artifact-dir dist --artifact-dir reference/dist --output build/receipts/source-build.json
      - name: Explain this job's boundary
        run: |
          echo "Source tests and Linux user-process integration only." >> "$GITHUB_STEP_SUMMARY"
          echo "No production signing, publication, Windows service, Docker, reboot or frozen-installer acceptance is performed." >> "$GITHUB_STEP_SUMMARY"

  windows-core:
    name: Windows portable source subset (no service installation)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Preserve checked-in LF golden files on this ephemeral runner
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select CPython 3.14.9 x64 with GIL
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
          architecture: x64
          check-latest: false
          allow-prereleases: false
          freethreaded: false
      - name: Isolate build tools
        shell: pwsh
        run: |
          python -m venv .venv-ci
          "$env:GITHUB_WORKSPACE\.venv-ci\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install exact hashed wheels
        shell: pwsh
        run: |
          python -m pip --isolated install --require-hashes --only-binary=:all: -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip --isolated check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_build_lock.py --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run portable source subset
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_manifest.py tests/test_manifest_v2.py tests/test_i18n.py
          tests/test_trust.py tests/test_render_docker.py tests/test_windows_ps.py
          tests/test_build_lock.py tests/test_build_receipt.py
          tests/test_process_liveness.py tests/test_local_artifacts.py
          integration_tests/test_windows_owner_liveness.py
      - name: Build SDK and reference wheels without dependency resolution
        shell: pwsh
        run: |
          python -m build --wheel --no-isolation --outdir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --no-isolation --outdir reference/dist reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record source and wheel inputs locally
        shell: pwsh
        run: python tools/build_receipt.py --artifact-dir dist --artifact-dir reference/dist --output build/receipts/source-build.json
      - name: Explain this job's boundary
        shell: pwsh
        run: |
          "Portable source subset on Windows only." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "No administrator/UAC flow, native service installation, startup after reboot, Docker Desktop or frozen Windows installer acceptance is performed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  linux-installed:
    name: Linux installed SDK and reference lifecycle (DEV)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select CPython 3.14.9 x64 with GIL
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
          architecture: x64
          check-latest: false
          allow-prereleases: false
          freethreaded: false
      - name: Prepare exact build tools outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/hinstall-build"
          echo "$RUNNER_TEMP/hinstall-build/bin" >> "$GITHUB_PATH"
      - name: Download and verify the platform wheelhouse
        run: |
          python -m pip --isolated download --require-hashes --only-binary=:all: -r requirements-build.lock --dest "$RUNNER_TEMP/hinstall-wheelhouse"
          python -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/hinstall-wheelhouse" --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip --isolated check
          python tools/check_build_lock.py --installed
      - name: Verify installed public SDK and CLI outside the checkout
        run: >-
          python -B packaging/check_installed_sdk.py
          --work-dir "$RUNNER_TEMP/hinstall-sdk-check"
          --receipt "$RUNNER_TEMP/hinstall-receipts/sdk.json"
      - name: Verify installed prerequisite planning and recovery
        run: >-
          python -B packaging/check_installed_prerequisites.py
          --work-dir "$RUNNER_TEMP/hinstall-prerequisites-check"
          --receipt "$RUNNER_TEMP/hinstall-receipts/prerequisites.json"
          --wheelhouse "$RUNNER_TEMP/hinstall-wheelhouse"
      - name: Verify all twelve installed reference profiles sequentially
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=0
          for profile in update update-lost-ack update-missing-ledger update-tampered-backup update-foreign-backup update-live-data-drift update-candidate-health update-candidate-cleanup recovery-restore recovery-rollback recovery-lost-ack recovery-missing-ledger; do
            receipt_name="$profile"
            if [ "$profile" = update ]; then
              receipt_name=reference-update
            fi
            if ! python -B packaging/check_installed_reference_lifecycle.py \
                --work-dir "$RUNNER_TEMP/hinstall-reference-$profile" \
                --receipt "$RUNNER_TEMP/hinstall-receipts/$receipt_name.json" \
                --wheelhouse "$RUNNER_TEMP/hinstall-wheelhouse" \
                --sdk-revision "$GITHUB_SHA" \
                --profile "$profile"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Record the exact installed check results
        if: always()
        run: |
          python -B tools/summarize_installed_checks.py --receipts "$RUNNER_TEMP/hinstall-receipts" --summary "$GITHUB_STEP_SUMMARY" --source-revision "$GITHUB_SHA" --include-fault-profiles
