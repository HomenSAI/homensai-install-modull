      "get": {
        "operationId": "operations_list",
        "description": "Найти сохранённые операции после перезапуска bootstrap/потери UI-сессии. Product ID фиксируется сервером из startup manifest. Отсутствие journal даёт пустой список без создания state. Dead owner переводится в RECOVERY_REQUIRED; действия не запускаются.",
        "parameters": [
          {
            "name": "unfinished_only",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": true
            },
            "description": "Включает незавершённые статусы и result.resume_required=true; false включает завершённые операции."
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Ограниченный список метаданных сохранённых операций текущего продукта; без автоматического resume.",
