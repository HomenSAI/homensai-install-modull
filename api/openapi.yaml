          },
          "400": {
            "description": "Structured error envelope"
          }
        },
        "security": [
          {
            "InstallerSession": []
          }
        ],
        "summary": "Confirmed export of the exact preview into private state and browser download; never uploads",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "confirmed",
                  "expected_digest",
                  "operation_id"
                ],
                "properties": {
                  "operation_id": {
                    "type": "string",
                    "description": "Operation belonging to the startup product; required by wizard"
                  },
                  "locale": {
                    "enum": [
                      "ru",
                      "en",
                      "de"
                    ]
                  },
                  "confirmed": {
                    "const": true
                  },
                  "expected_digest": {
                    "type": "string",
                    "pattern": "^[0-9a-f]{64}$"
                  }
                }
              }
            }
          }
        }
      }
    }
