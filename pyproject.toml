[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "homensai-installer-client"
version = "0.13.0"
description = "Experimental local JSON client for the HomenS.AI installer"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools]
packages = ["homensai_installer_client"]

[tool.setuptools.package-data]
homensai_installer_client = ["schemas/*.json"]
