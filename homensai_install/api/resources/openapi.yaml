        "properties": {
          "mode": {
            "enum": [
              "background",
              "synchronous"
            ]
          },
          "state": {
            "enum": [
              "queued",
              "running",
              "finished",
              "failed",
              "superseded",
              "idle",
              "recovery_required",
              "unknown"
            ]
          },
          "active": {
            "type": [
              "boolean",
              "null"
            ]
          }
        }
      },
      "PrerequisiteSnapshot": {
        "type": "object",
        "required": [
          "operation_id",
          "product_id",
          "owner_id",
          "target",
          "catalog_digest",
          "plan_digest",
          "status",
          "ready",
          "revision",
          "execution"
        ],
        "properties": {
          "operation_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_-]{0,79}$"
          },
          "product_id": {
            "type": "string"
          },
          "owner_id": {
            "type": "string"
          },
          "target": {
            "type": "object"
          },
          "catalog_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "plan_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "status": {
            "type": "string"
          },
          "ready": {
            "type": "boolean"
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "execution": {
            "$ref": "#/components/schemas/PrerequisiteExecution"
          },
          "download_progress": {
            "$ref": "#/components/schemas/PrerequisiteDownloadProgress"
          }
        }
      },
      "PrerequisiteDownloadProgress": {
        "type": "object",
        "description": "Последнее сохранённое измерение одного artifact. plan_digest, component_id, artifact_id, artifact_sha256 и total привязаны к принятому signed plan. completed <= total; для transferring completed < total, percent = floor(completed * 100 / total). verified требует completed == total и SHA-256 staged файла; это не dependency READY. После обрыва completed не является durable offset файла. sequence связан с событием той же транзакции и не превышает revision содержащего snapshot.",
        "properties": {
          "schema_version": {
            "type": "integer",
            "const": 1
          },
          "plan_digest": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "pattern": "^[0-9a-f]{64}$(?![\\s\\S])"
          },
          "component_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "artifact_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "artifact_sha256": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "pattern": "^[0-9a-f]{64}$(?![\\s\\S])"
          },
          "transfer_id": {
            "type": "string",
            "minLength": 32,
            "maxLength": 32,
            "pattern": "^[0-9a-f]{32}$(?![\\s\\S])",
            "description": "Идентификатор одного transfer; не token авторизации или execution lease."
          },
          "attempt": {
            "type": "integer",
            "minimum": 0,
            "maximum": 7
          },
          "state": {
            "type": "string",
            "enum": [
              "preparing",
              "transferring",
              "verifying",
              "retrying",
              "verified",
              "failed",
              "canceled"
            ]
          },
          "completed": {
            "type": "integer",
            "minimum": 0,
            "maximum": 68719476736
          },
          "total": {
            "type": "integer",
            "minimum": 1,
            "maximum": 68719476736
          },
          "unit": {
            "type": "string",
            "const": "bytes"
          },
          "source": {
            "type": "string",
            "enum": [
              "unknown",
              "network",
              "cache",
              "partial",
              "local"
            ]
          },
          "resumed": {
            "type": "boolean"
          },
          "verified": {
            "type": "boolean"
          },
          "percent": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 100
          },
          "sequence": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "updated_at": {
            "type": "string",
            "format": "date-time",
            "minLength": 20,
            "maxLength": 32,
            "pattern": "Z$(?![\\s\\S])"
          }
        },
        "additionalProperties": false,
        "allOf": [
          {
            "if": {
              "properties": {
                "state": {
                  "const": "verified"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "properties": {
                "verified": {
                  "const": true
                },
                "percent": {
                  "const": 100
                },
                "source": {
                  "enum": [
                    "network",
                    "cache",
                    "partial",
                    "local"
                  ]
                }
              }
            },
            "else": {
              "properties": {
                "verified": {
                  "const": false
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "transferring"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "properties": {
                "percent": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 99
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "enum": [
                    "preparing",
                    "verifying",
                    "retrying",
                    "failed",
                    "canceled"
                  ]
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "properties": {
                "percent": {
                  "type": "null"
                }
              }
            }
          }
        ],
        "required": [
          "schema_version",
          "plan_digest",
          "component_id",
          "artifact_id",
          "artifact_sha256",
          "transfer_id",
          "attempt",
          "state",
          "completed",
          "total",
          "unit",
          "source",
          "resumed",
          "verified",
          "percent",
          "sequence",
          "updated_at"
        ]
      },
      "PrerequisiteEventsResult": {
        "type": "object",
        "description": "Упорядоченная страница общего журнала и текущий snapshot. after_sequence продвигается только по последнему полученному событию; snapshot.revision может быть новее страницы. Для prerequisite_download sequence/component_id/timestamp совпадают с download_progress.sequence/component_id/updated_at. Snapshot и progress event коммитятся атомарно; status и события сами не возобновляют effects.",
        "properties": {
          "events": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "type": "object",
              "properties": {
                "download_progress": {
                  "$ref": "#/components/schemas/PrerequisiteDownloadProgress"
                }
              },
              "allOf": [
                {
                  "if": {
                    "properties": {
                      "type": {
                        "const": "prerequisite_download"
                      }
                    },
                    "required": [
                      "type"
                    ]
                  },
                  "then": {
                    "required": [
                      "download_progress"
                    ]
                  }
                }
              ]
            }
          },
          "snapshot": {
            "$ref": "#/components/schemas/PrerequisiteSnapshot"
          }
        },
        "required": [
          "events",
          "snapshot"
        ],
        "additionalProperties": false
      },
      "PrerequisitePlanResult": {
        "type": "object",
        "properties": {
          "plan_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_-]{0,79}$"
          },
          "operation_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_-]{0,79}$"
          },
          "plan_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "plan": {
            "type": "object"
          },
          "terms_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "locale": {
            "enum": [
              "ru",
              "en",
              "de"
            ]
          },
          "production_ready": {
            "const": false
          }
        },
        "required": [
          "plan_id",
          "operation_id",
          "plan_digest",
          "plan",
          "terms_digest",
          "locale",
          "production_ready"
        ],
        "additionalProperties": false
      },
      "PrerequisiteHTTPEnvelope": {
        "oneOf": [
          {
            "type": "object",
            "properties": {
              "api_version": {
                "const": "1"
              },
              "result": {}
            },
            "required": [
              "api_version",
              "result"
            ],
            "additionalProperties": false
          },
          {
            "type": "object",
            "properties": {
              "api_version": {
                "const": "1"
              },
              "error": {
                "type": "object"
              }
            },
            "required": [
              "error"
            ],
            "additionalProperties": false
          }
        ]
      },
      "PrerequisiteRequirement": {
        "type": "object",
        "description": "Проверенная проекция signed requirement; только данные для просмотра, без путей/URL/команд. Границы включительные; null снимает соответствующее ограничение. Числовое сравнение MAJOR.MINOR.PATCH: пропущенный PATCH равен 0, v и +build игнорируются. Prerelease/PEP 440 не поддерживаются.",
        "properties": {
          "component_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "kind": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "required": {
            "type": "boolean"
          },
          "minimum_version": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^v?[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:\\+[A-Za-z0-9_.-]+)?$(?![\\s\\S])"
          },
          "maximum_version": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^v?[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:\\+[A-Za-z0-9_.-]+)?$(?![\\s\\S])"
          },
          "scope": {
            "enum": [
              "host",
              "controller",
              "product"
            ]
          }
        },
        "required": [
          "component_id",
          "kind",
          "required",
          "minimum_version",
          "maximum_version",
          "scope"
        ],
        "additionalProperties": false
      },
      "PrerequisiteCapabilitiesResult": {
        "type": "object",
        "description": "Возможности явной регистрации. requirements добавлены независимо от raw plan v1; его digest/consent refs и сохранённые queued операции не меняются. Для соединения requirements с plan по component_id нужны совпадающие product_id/owner_id/target/catalog_digest. Отсутствие requirements у старого сервера означает недоступные сведения, а не неограниченную версию.",
        "properties": {
          "api_version": {
            "const": "1.0"
          },
          "configured": {
            "type": "boolean"
          },
          "product_id": {
            "type": "string"
          },
          "owner_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "target": {
            "type": "object"
          },
          "catalog_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "requirements": {
            "type": "array",
            "minItems": 1,
            "maxItems": 128,
            "items": {
              "$ref": "#/components/schemas/PrerequisiteRequirement"
            }
          },
          "automatic_component_ids": {
            "type": "array",
            "maxItems": 128,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128,
              "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
            }
          },
          "production_ready": {
            "const": false
          },
          "durable_byte_progress": {
            "type": "boolean",
            "description": "Поддержка сохранённых byte observations; поле необязательно для старых серверов. true не гарантирует наличие download_progress до первой загрузки и не объявляет operation READY."
          },
          "local_artifact_upload": {
            "type": "boolean",
            "description": "Явный binary staging локального prerequisite; не является разрешением установки."
          },
          "local_upload_max_bytes": {
            "type": "integer",
            "const": 4294967296
          }
        },
        "required": [
          "configured",
          "automatic_component_ids",
          "production_ready"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "configured": {
                  "const": true
                }
              },
              "required": [
                "configured"
              ]
            },
            "then": {
              "required": [
                "product_id",
                "owner_id",
                "target",
                "catalog_digest",
                "requirements"
              ]
            }
          }
        ],
        "additionalProperties": true
      },
      "PrerequisiteUploadRequest": {
        "type": "object",
        "properties": {
          "plan_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_-]{0,79}$(?![\\s\\S])"
          },
          "plan_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$(?![\\s\\S])"
          },
          "component_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
          },
          "artifact_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$(?![\\s\\S])"
