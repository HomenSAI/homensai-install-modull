[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homensai-reference"
version = "1.0.0"
description = "Синтетический reference product для проверки HomenSAI Installer"
requires-python = ">=3.14,<3.15"
authors = [{name = "Serhii Khomenko"}]

[tool.setuptools.packages.find]
where = ["src"]
